name: Update calendar
on:
  schedule:
    - cron: "10 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: calendar
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build calendar
        run: python3 calendar_build.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.json
          git diff --staged --quiet || (git commit -m "update calendar" && git pull --rebase -q && git push)
